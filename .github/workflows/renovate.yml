name: Renovate

on:
  # Lancement automatique du lundi au vendredi à 4h du matin
  schedule:
    - cron: '0 4 * * 1-5'
  # Permet un déclenchement manuel depuis l'interface GitHub
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Exécution de Renovate
        uses: renovatebot/github-action@8ac70de2fe55752c573155866e30735411e3b61c # v41.0.22
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: info