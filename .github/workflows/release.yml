name: release

on:
  workflow_dispatch:

jobs:
  prebuild-qa:
    uses: ./.github/workflows/qa.yml
    secrets: inherit

  upgrade-version:
    needs: prebuild-qa
    runs-on: ubuntu-24.04
    outputs:
      new_tag_with_v: ${{ steps.version.outputs.new_tag }}
      new_tag: ${{ steps.version_no_v.outputs.new_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '0'

      - name: Compute the new version number
        id: version
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8 # v1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          RELEASE_BRANCHES: 'develop'
          DRY_RUN: true
          TAG_PREFIX: 'v'

      - name: Strip "v" prefix from tag
        id: version_no_v
        run: |
          echo "new_tag=${steps_version_outputs_new_tag#v}" >> $GITHUB_OUTPUT
        env:
          steps_version_outputs_new_tag: ${{ steps.version.outputs.new_tag }}

      - name: Update version in all package.json files
        run: |
          NEW_VER="${{ steps.version_no_v.outputs.new_tag }}"
          FILES=(
            "package.json"
            "packages/api/package.json"
            "packages/frontend/webapp/package.json"
            "packages/frontend/www/package.json"
          )
          for file in "${FILES[@]}"; do
            jq --arg v "$NEW_VER" '.version = $v' "$file" > tmp.json && mv tmp.json "$file"
          done

      - name: Commit change in package.json and tag
        run: |
          git config --local user.email "admin@resorption-bidonvilles.beta.gouv.fr"
          git config --local user.name "GitHub Action"
          git commit -m "📦 Release ${{ steps.version.outputs.new_tag }}" -a
          git tag ${{ steps.version.outputs.new_tag }}
          git push origin HEAD:${{ github.ref }} --tags

      - name: Merge develop into master
        run: |
          git fetch origin master
          git checkout master
          git merge develop -m "Merge branch 'develop' into master"
          git push origin master

  build-www:
    needs: upgrade-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 'master'
          fetch-depth: '0'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-www-buildx-${{ needs['upgrade-version'].outputs.new_tag_with_v }}
          restore-keys: |
            ${{ runner.os }}-www-buildx
          fail-on-cache-miss: false
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.www
          push: true
          tags: resorptionbidonvilles/www:${{ needs['upgrade-version'].outputs.new_tag_with_v }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

  build-webapp:
    needs: upgrade-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 'master'
          fetch-depth: '0'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-webapp-buildx-${{ needs['upgrade-version'].outputs.new_tag_with_v }}
          restore-keys: |
            ${{ runner.os }}-webapp-buildx
          fail-on-cache-miss: false
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.webapp
          push: true
          tags: resorptionbidonvilles/frontend:${{ needs['upgrade-version'].outputs.new_tag_with_v }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

  build-api:
    needs: upgrade-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 'master'
          fetch-depth: '0'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-api-buildx-${{ needs['upgrade-version'].outputs.new_tag_with_v }}
          restore-keys: |
            ${{ runner.os }}-api-buildx
          fail-on-cache-miss: false
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: resorptionbidonvilles/api:${{ needs['upgrade-version'].outputs.new_tag_with_v }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
